<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bloodBg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1120"/>
      <stop offset="1" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="bloodRed" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#EF4444"/>
      <stop offset="1" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="donorCard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1E293B" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="accentG" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bloodBg)"/>
  
  <!-- Subtle Grid -->
  <path d="M0 100H800M0 200H800M0 300H800M0 400H800" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" opacity="0.25"/>
  <path d="M200 0V500M400 0V500M600 0V500" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" opacity="0.25"/>

  <!-- Browser Header -->
  <rect x="40" y="30" width="720" height="42" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1"/>
  <circle cx="65" cy="51" r="5" fill="#EF4444"/>
  <circle cx="82" cy="51" r="5" fill="#F59E0B"/>
  <circle cx="99" cy="51" r="5" fill="#10B981"/>
  <rect x="130" y="41" width="300" height="20" rx="4" fill="#1F2937"/>
  <text x="145" y="55" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11" font-weight="500">https://findmyblood.org/emergency-portal</text>
  <rect x="660" y="41" width="80" height="20" rx="4" fill="#EF4444" fill-opacity="0.2"/>
  <text x="670" y="55" fill="#FCA5A5" font-family="Inter, sans-serif" font-size="11" font-weight="600">● LIVE RADAR</text>

  <!-- Content Layout -->
  <g transform="translate(60, 95)">
    <!-- Urgent Request Card -->
    <rect x="0" y="0" width="320" height="360" rx="12" fill="url(#donorCard)" stroke="#DC2626" stroke-width="1" stroke-opacity="0.4"/>
    
    <!-- Heartbeat icon / blood drop -->
    <circle cx="45" cy="45" r="22" fill="#EF4444" fill-opacity="0.15"/>
    <path d="M45 32C45 32 35 44 35 50C35 55.5 39.5 60 45 60C50.5 60 55 55.5 55 50C55 44 45 32 45 32Z" fill="#EF4444"/>
    <text x="80" y="42" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="16" font-weight="700">FindMyBlood</text>
    <text x="80" y="58" fill="#FCA5A5" font-family="Inter, sans-serif" font-size="11" font-weight="600">EMERGENCY DONOR NETWORK</text>

    <!-- Search selector -->
    <text x="25" y="95" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12" font-weight="600">SELECT BLOOD GROUP</text>
    <g transform="translate(25, 110)">
      <rect x="0" y="0" width="55" height="32" rx="6" fill="#EF4444"/>
      <text x="18" y="21" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="13" font-weight="700">A+</text>
      <rect x="68" y="0" width="55" height="32" rx="6" fill="#1E293B"/>
      <text x="86" y="21" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13" font-weight="600">B+</text>
      <rect x="136" y="0" width="55" height="32" rx="6" fill="#1E293B"/>
      <text x="154" y="21" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13" font-weight="600">O+</text>
      <rect x="204" y="0" width="65" height="32" rx="6" fill="#1E293B"/>
      <text x="218" y="21" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13" font-weight="600">AB+</text>
    </g>

    <!-- Urgent Alert Box -->
    <rect x="25" y="165" width="270" height="100" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="40" y="190" fill="#EF4444" font-family="Inter, sans-serif" font-size="12" font-weight="700">🚨 IMMEDIATE NEED: A+ PLASMA</text>
    <text x="40" y="212" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="12">District Civil Hospital, Mathura</text>
    <text x="40" y="230" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11">Radius: Within 12 km • 3 Donors Responding</text>
    <rect x="40" y="240" width="100" height="16" rx="4" fill="#10B981" fill-opacity="0.2"/>
    <text x="48" y="252" fill="#34D399" font-family="Inter, sans-serif" font-size="9" font-weight="600">VERIFIED REQUEST</text>

    <!-- Action Button -->
    <rect x="25" y="290" width="270" height="44" rx="8" fill="url(#bloodRed)"/>
    <text x="85" y="317" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="13" font-weight="700">BroadCast Emergency Alert</text>

    <!-- Right Side: Matching Donors List -->
    <g transform="translate(340, 0)">
      <rect x="0" y="0" width="340" height="360" rx="12" fill="url(#donorCard)" stroke="#334155" stroke-width="1"/>
      <text x="25" y="35" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="14" font-weight="700">Eligible Nearby Donors (14)</text>

      <!-- Donor 1 -->
      <g transform="translate(20, 55)">
        <rect width="300" height="85" rx="8" fill="#0B1120" stroke="#334155" stroke-width="1"/>
        <circle cx="35" cy="42" r="18" fill="#06B6D4" fill-opacity="0.2"/>
        <text x="28" y="47" fill="#22D3EE" font-family="Inter, sans-serif" font-size="12" font-weight="700">A+</text>
        <text x="65" y="35" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="13" font-weight="600">Rahul Sharma</text>
        <text x="65" y="52" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11">2.4 km away • Last donated: 4 mo ago</text>
        <rect x="65" y="60" width="60" height="18" rx="4" fill="#10B981" fill-opacity="0.2"/>
        <text x="73" y="73" fill="#6EE7B7" font-family="Inter, sans-serif" font-size="9" font-weight="600">AVAILABLE</text>
        <rect x="220" y="28" width="65" height="28" rx="6" fill="#06B6D4" fill-opacity="0.2" stroke="#06B6D4"/>
        <text x="233" y="46" fill="#67E8F9" font-family="Inter, sans-serif" font-size="11" font-weight="600">Connect</text>
      </g>

      <!-- Donor 2 -->
      <g transform="translate(20, 150)">
        <rect width="300" height="85" rx="8" fill="#0B1120" stroke="#334155" stroke-width="1"/>
        <circle cx="35" cy="42" r="18" fill="#8B5CF6" fill-opacity="0.2"/>
        <text x="28" y="47" fill="#A78BFA" font-family="Inter, sans-serif" font-size="12" font-weight="700">A+</text>
        <text x="65" y="35" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="13" font-weight="600">Vikram Singh</text>
        <text x="65" y="52" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11">4.1 km away • Verified Regular Donor</text>
        <rect x="65" y="60" width="60" height="18" rx="4" fill="#10B981" fill-opacity="0.2"/>
        <text x="73" y="73" fill="#6EE7B7" font-family="Inter, sans-serif" font-size="9" font-weight="600">AVAILABLE</text>
        <rect x="220" y="28" width="65" height="28" rx="6" fill="#06B6D4" fill-opacity="0.2" stroke="#06B6D4"/>
        <text x="233" y="46" fill="#67E8F9" font-family="Inter, sans-serif" font-size="11" font-weight="600">Connect</text>
      </g>

      <!-- Security / Confidentiality Note -->
      <g transform="translate(20, 250)">
        <rect width="300" height="90" rx="8" fill="#1E293B" stroke="#4C1D95" stroke-opacity="0.5"/>
        <text x="20" y="32" fill="#A78BFA" font-family="Inter, sans-serif" font-size="11" font-weight="700">🔒 SECURE MASKED DIRECT CALLING</text>
        <text x="20" y="52" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11">Contact information is privacy-shielded until both parties confirm medical consent.</text>
      </g>
    </g>
  </g>
</svg>
