<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="kiddyBg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1120"/>
      <stop offset="1" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="cardK" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1E293B" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="agencyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#kiddyBg)"/>
  
  <path d="M0 100H800M0 200H800M0 300H800M0 400H800" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" opacity="0.25"/>
  <path d="M200 0V500M400 0V500M600 0V500" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" opacity="0.25"/>

  <!-- Browser Header -->
  <rect x="40" y="30" width="720" height="42" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1"/>
  <circle cx="65" cy="51" r="5" fill="#EF4444"/>
  <circle cx="82" cy="51" r="5" fill="#F59E0B"/>
  <circle cx="99" cy="51" r="5" fill="#10B981"/>
  <rect x="130" y="41" width="300" height="20" rx="4" fill="#1F2937"/>
  <text x="145" y="55" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11" font-weight="500">https://kiddysolutions.com</text>
  <rect x="640" y="41" width="100" height="20" rx="4" fill="#3B82F6" fill-opacity="0.2"/>
  <text x="650" y="55" fill="#93C5FD" font-family="Inter, sans-serif" font-size="11" font-weight="600">DIGITAL AGENCY</text>

  <!-- Content Layout -->
  <g transform="translate(60, 95)">
    <!-- Agency Hero Presentation -->
    <rect x="0" y="0" width="440" height="360" rx="12" fill="url(#cardK)" stroke="#334155" stroke-width="1"/>
    
    <text x="30" y="45" fill="#60A5FA" font-family="Inter, sans-serif" font-size="12" font-weight="700">MODERN WEB &amp; SOFTWARE SOLUTIONS</text>
    <text x="30" y="80" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="22" font-weight="800">Transforming Ideas Into</text>
    <text x="30" y="110" fill="#38BDF8" font-family="Inter, sans-serif" font-size="22" font-weight="800">High-Performance Products</text>
    
    <text x="30" y="145" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">End-to-end web engineering, bespoke client portals, responsive commercial websites, and high-conversion e-commerce.</text>

    <!-- Services Grid -->
    <g transform="translate(30, 175)">
      <rect width="180" height="65" rx="6" fill="#0B1120" stroke="#334155"/>
      <text x="15" y="28" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="12" font-weight="700">⚡ Web Development</text>
      <text x="15" y="48" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">React, Node.js &amp; Custom CMS</text>

      <rect x="200" width="180" height="65" rx="6" fill="#0B1120" stroke="#334155"/>
      <text x="215" y="28" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="12" font-weight="700">🎨 UI/UX Product Design</text>
      <text x="215" y="48" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">Modern Responsive Systems</text>

      <rect y="80" width="180" height="65" rx="6" fill="#0B1120" stroke="#334155"/>
      <text x="15" y="108" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="12" font-weight="700">🚀 Performance &amp; SEO</text>
      <text x="15" y="128" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">95+ Lighthouse Score Guaranteed</text>

      <rect x="200" y="80" width="180" height="65" rx="6" fill="#0B1120" stroke="#334155"/>
      <text x="215" y="108" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="12" font-weight="700">💳 Payment Integrations</text>
      <text x="215" y="128" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">Secure Gateway Gateways</text>
    </g>

    <!-- Right Side: Metrics & Client Testimonial -->
    <g transform="translate(460, 0)">
      <rect x="0" y="0" width="220" height="360" rx="12" fill="url(#cardK)" stroke="#334155" stroke-width="1"/>
      
      <!-- Metrics -->
      <g transform="translate(20, 25)">
        <text x="0" y="20" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11" font-weight="600">DELIVERY SPEED</text>
        <text x="0" y="46" fill="#34D399" font-family="Inter, sans-serif" font-size="22" font-weight="800">2x Faster</text>
        <line x1="0" y1="65" x2="180" y2="65" stroke="#334155"/>

        <text x="0" y="90" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11" font-weight="600">CLIENT SATISFACTION</text>
        <text x="0" y="116" fill="#60A5FA" font-family="Inter, sans-serif" font-size="22" font-weight="800">100%</text>
        <line x1="0" y1="135" x2="180" y2="135" stroke="#334155"/>

        <text x="0" y="160" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11" font-weight="600">CORE TECH</text>
        <text x="0" y="186" fill="#DDD6FE" font-family="Inter, sans-serif" font-size="16" font-weight="700">Full Stack Scalable</text>

        <!-- CTA button -->
        <rect x="0" y="220" width="180" height="42" rx="8" fill="url(#agencyGrad)"/>
        <text x="26" y="246" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12" font-weight="700">Explore Case Studies</text>
      </g>
    </g>
  </g>
</svg>
