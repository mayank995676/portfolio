<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="pantryBg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1120"/>
      <stop offset="1" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="cardP" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1E293B" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#10B981"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#pantryBg)"/>
  
  <path d="M0 100H800M0 200H800M0 300H800M0 400H800" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" opacity="0.25"/>
  <path d="M200 0V500M400 0V500M600 0V500" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" opacity="0.25"/>

  <!-- Browser Header -->
  <rect x="40" y="30" width="720" height="42" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1"/>
  <circle cx="65" cy="51" r="5" fill="#EF4444"/>
  <circle cx="82" cy="51" r="5" fill="#F59E0B"/>
  <circle cx="99" cy="51" r="5" fill="#10B981"/>
  <rect x="130" y="41" width="300" height="20" rx="4" fill="#1F2937"/>
  <text x="145" y="55" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11" font-weight="500">https://pantrypal.app/dashboard</text>
  <rect x="650" y="41" width="90" height="20" rx="4" fill="#10B981" fill-opacity="0.2"/>
  <text x="660" y="55" fill="#6EE7B7" font-family="Inter, sans-serif" font-size="11" font-weight="600">ZERO WASTE</text>

  <!-- App Body -->
  <g transform="translate(60, 95)">
    <!-- Pantry Inventory Summary -->
    <rect x="0" y="0" width="420" height="360" rx="12" fill="url(#cardP)" stroke="#334155" stroke-width="1"/>
    <text x="25" y="35" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="15" font-weight="700">Pantry &amp; Fridge Inventory</text>
    <text x="25" y="55" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11">42 Total Items • 3 Expiring Soon</text>

    <!-- Item 1 (Alert Expiring) -->
    <g transform="translate(20, 75)">
      <rect width="380" height="70" rx="8" fill="#0B1120" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="35" cy="35" r="18" fill="#F59E0B" fill-opacity="0.15"/>
      <text x="28" y="40" font-size="16">🥛</text>
      <text x="65" y="30" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="13" font-weight="600">Organic Whole Milk (1L)</text>
      <text x="65" y="48" fill="#FBBF24" font-family="Inter, sans-serif" font-size="11" font-weight="600">⚠️ Expiring in 2 days (Oct 1)</text>
      <rect x="290" y="24" width="75" height="24" rx="4" fill="#F59E0B" fill-opacity="0.2"/>
      <text x="303" y="40" fill="#FCD34D" font-family="Inter, sans-serif" font-size="10" font-weight="700">Use First</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(20, 155)">
      <rect width="380" height="70" rx="8" fill="#0B1120" stroke="#334155" stroke-width="1"/>
      <circle cx="35" cy="35" r="18" fill="#10B981" fill-opacity="0.15"/>
      <text x="28" y="40" font-size="16">🥑</text>
      <text x="65" y="30" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="13" font-weight="600">Fresh Hass Avocados (3 pcs)</text>
      <text x="65" y="48" fill="#34D399" font-family="Inter, sans-serif" font-size="11">Optimal freshness • 5 days left</text>
      <rect x="290" y="24" width="75" height="24" rx="4" fill="#10B981" fill-opacity="0.2"/>
      <text x="306" y="40" fill="#6EE7B7" font-family="Inter, sans-serif" font-size="10" font-weight="700">In Stock</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(20, 235)">
      <rect width="380" height="70" rx="8" fill="#0B1120" stroke="#334155" stroke-width="1"/>
      <circle cx="35" cy="35" r="18" fill="#8B5CF6" fill-opacity="0.15"/>
      <text x="28" y="40" font-size="16">🍝</text>
      <text x="65" y="30" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="13" font-weight="600">Italian Penne Rigate</text>
      <text x="65" y="48" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11">Dry Pantry • 180 days shelf-life</text>
      <rect x="290" y="24" width="75" height="24" rx="4" fill="#8B5CF6" fill-opacity="0.2"/>
      <text x="306" y="40" fill="#C4B5FD" font-family="Inter, sans-serif" font-size="10" font-weight="700">Stable</text>
    </g>

    <!-- Right Side: AI Smart Recipe Suggestions -->
    <g transform="translate(440, 0)">
      <rect x="0" y="0" width="240" height="360" rx="12" fill="url(#cardP)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="35" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="14" font-weight="700">Smart Recipes</text>
      <text x="20" y="55" fill="#06B6D4" font-family="Inter, sans-serif" font-size="11" font-weight="600">Based on expiring items:</text>

      <rect x="15" y="75" width="210" height="120" rx="8" fill="#0B1120" stroke="#06B6D4" stroke-opacity="0.3"/>
      <text x="25" y="100" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="12" font-weight="700">Creamy Avocado Pasta</text>
      <text x="25" y="120" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">Uses Milk + Avocados + Penne</text>
      <rect x="25" y="132" width="70" height="18" rx="4" fill="#06B6D4" fill-opacity="0.2"/>
      <text x="32" y="145" fill="#67E8F9" font-family="Inter, sans-serif" font-size="9" font-weight="600">92% Match</text>
      <rect x="25" y="158" width="160" height="24" rx="4" fill="url(#tealGrad)"/>
      <text x="55" y="174" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="10" font-weight="700">Cook This Tonight</text>

      <rect x="15" y="210" width="210" height="120" rx="8" fill="#0B1120" stroke="#334155"/>
      <text x="25" y="235" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="12" font-weight="700">Zero-Waste Berry Shake</text>
      <text x="25" y="255" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">High calcium • 5 mins prep</text>
      <rect x="25" y="267" width="80" height="18" rx="4" fill="#8B5CF6" fill-opacity="0.2"/>
      <text x="32" y="280" fill="#C4B5FD" font-family="Inter, sans-serif" font-size="9" font-weight="600">Quick Snack</text>
    </g>
  </g>
</svg>
