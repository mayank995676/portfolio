<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="safeBg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1120"/>
      <stop offset="1" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="cardS" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1E293B" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#safeBg)"/>
  
  <path d="M0 100H800M0 200H800M0 300H800M0 400H800" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" opacity="0.25"/>
  <path d="M200 0V500M400 0V500M600 0V500" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" opacity="0.25"/>

  <!-- Browser Header -->
  <rect x="40" y="30" width="720" height="42" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1"/>
  <circle cx="65" cy="51" r="5" fill="#EF4444"/>
  <circle cx="82" cy="51" r="5" fill="#F59E0B"/>
  <circle cx="99" cy="51" r="5" fill="#10B981"/>
  <rect x="130" y="41" width="300" height="20" rx="4" fill="#1F2937"/>
  <text x="145" y="55" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11" font-weight="500">https://safebite.ai/safety-scan</text>
  <rect x="640" y="41" width="100" height="20" rx="4" fill="#8B5CF6" fill-opacity="0.2"/>
  <text x="650" y="55" fill="#C4B5FD" font-family="Inter, sans-serif" font-size="11" font-weight="600">✨ AI TOXICITY ENGINE</text>

  <!-- Content Layout -->
  <g transform="translate(60, 95)">
    <!-- Scanner Card -->
    <rect x="0" y="0" width="330" height="360" rx="12" fill="url(#cardS)" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.5"/>
    <text x="25" y="35" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="15" font-weight="700">SafeBite AI Vision</text>
    <text x="25" y="52" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11">Real-time Botanical &amp; Food Risk Analysis</text>

    <!-- Scan Viewport Box -->
    <rect x="25" y="70" width="280" height="180" rx="8" fill="#0B1120" stroke="#334155"/>
    
    <!-- Plant representation -->
    <circle cx="165" cy="155" r="45" fill="#10B981" fill-opacity="0.2"/>
    <path d="M165 115C185 130 185 170 165 195C145 170 145 130 165 115Z" fill="#10B981"/>
    
    <!-- AI Reticle Overlay -->
    <rect x="55" y="90" width="220" height="140" rx="4" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="8 8" fill="none"/>
    <rect x="65" y="100" width="105" height="20" rx="4" fill="#0F172A" fill-opacity="0.85"/>
    <text x="73" y="114" fill="#EC4899" font-family="Inter, sans-serif" font-size="10" font-weight="700">TARGET DETECTED</text>
    
    <!-- Quick Scan trigger -->
    <rect x="25" y="270" width="280" height="42" rx="8" fill="url(#aiGrad)"/>
    <text x="80" y="296" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12" font-weight="700">Analyze Ingredients / Plant</text>
    <text x="90" y="335" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">Powered by Neural Safety Models</text>

    <!-- Right Side: Evaluation Report -->
    <g transform="translate(350, 0)">
      <rect x="0" y="0" width="330" height="360" rx="12" fill="url(#cardS)" stroke="#334155" stroke-width="1"/>
      
      <!-- Classification -->
      <g transform="translate(20, 20)">
        <text x="0" y="20" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="16" font-weight="700">Monstera Deliciosa</text>
        <text x="0" y="38" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">Common Name: Swiss Cheese Plant</text>

        <!-- Toxicity Badge -->
        <rect x="0" y="50" width="290" height="45" rx="6" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-width="1"/>
        <text x="15" y="70" fill="#F87171" font-family="Inter, sans-serif" font-size="12" font-weight="700">⚠️ TOXIC TO PETS (CATS &amp; DOGS)</text>
        <text x="15" y="85" fill="#FCA5A5" font-family="Inter, sans-serif" font-size="10">Contains insoluble calcium oxalates</text>

        <!-- Safety Details Grid -->
        <g transform="translate(0, 110)">
          <rect width="138" height="60" rx="6" fill="#0B1120" stroke="#334155"/>
          <text x="12" y="22" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">HUMAN SAFETY</text>
          <text x="12" y="44" fill="#34D399" font-family="Inter, sans-serif" font-size="13" font-weight="700">Low Risk (Fruit)</text>

          <rect x="152" width="138" height="60" rx="6" fill="#0B1120" stroke="#334155"/>
          <text x="164" y="22" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">CONFIDENCE</text>
          <text x="164" y="44" fill="#60A5FA" font-family="Inter, sans-serif" font-size="13" font-weight="700">98.4% Match</text>
        </g>

        <!-- Actionable Advice -->
        <g transform="translate(0, 185)">
          <rect width="290" height="110" rx="6" fill="#0B1120" stroke="#334155"/>
          <text x="15" y="25" fill="#C4B5FD" font-family="Inter, sans-serif" font-size="11" font-weight="700">RECOMMENDED PROTOCOL</text>
          <text x="15" y="48" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="11">• Elevate pot out of reach of household pets.</text>
          <text x="15" y="68" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="11">• If chewed, rinse oral cavity with cold water.</text>
          <text x="15" y="88" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="11">• Contact emergency vet if swelling persists.</text>
        </g>
      </g>
    </g>
  </g>
</svg>
